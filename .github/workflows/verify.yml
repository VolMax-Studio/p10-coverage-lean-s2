name: verify
# S2a acceptance CI. A pass means the implementation's own acceptance command passed on the
# pinned toolchain. It is NOT an adversarial-gate verdict and NOT ratification of S2.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System packages (Lean runtime libs)
        run: sudo apt-get update && sudo apt-get install -y curl unzip python3-venv libgmp10 libuv1t64
      - name: Python environment (pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-virtualenv -r requirements.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Pinned Lean toolchain (package digest checked; no elan, no lake update)
        run: |
          .venv/bin/python --version
          eval "$(scripts/install_toolchain.sh)"
          echo "$PWD/.toolchain/lean4-4.33.0/bin" >> "$GITHUB_PATH"
      - name: S2a acceptance command (self-consistency; in-tree pins)
        env:
          P10_ALLOW_INTREE_PIN: "1"
        run: ./scripts/verify.sh
