name = "p10-coverage-lean-s2"
version = "0.0.1"
defaultTargets = ["P10S2"]

# S1 is required at the frozen ratified tag v0.1.0-s1-ratified (peeled commit
# e4db3747...). It is vendored byte-for-byte (git tree 6cdf48c2...) so that the
# Lean result reproduces offline; see S1_DEPENDENCY.md. Never `lake update`
# against a moving ref.
[[require]]
name = "p10-underdetermination-lean-s1"
path = "vendor/p10-underdetermination-lean-s1"

[leanOptions]
autoImplicit = false

# Manifest-covered checker library (partition rule: must never depend on
# P10S2Tests or on any file containing a verifier_manifest_digest).
[[lean_lib]]
name = "P10S2"
globs = ["P10S2", "P10S2.+"]

# Concrete vectors / test modules: outside VerifierManifestS2aV0.
[[lean_lib]]
name = "P10S2Tests"
globs = ["P10S2Tests", "P10S2Tests.+"]
